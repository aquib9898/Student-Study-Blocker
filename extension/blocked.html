<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked</title>
    <link rel="icon" href="icons/icon32.png" />
    <!-- Shown in place of the browser's own "This page is blocked" page (see
         background.js). Same colours as the desktop app, light or dark. -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #f3f3f3;
        --text: #1b1b1b;
        --muted: #616161;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #202020;
          --text: #ffffff;
          --muted: #c5c5c5;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--text);
        font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      main { padding: 32px; }
      /* The emblem's shape, drawn in the text colour: no background box. */
      .logo {
        width: 128px;
        height: 128px;
        margin: 0 auto 28px;
        background: var(--text);
        -webkit-mask: url(images/logo-mark.png) center / contain no-repeat;
        mask: url(images/logo-mark.png) center / contain no-repeat;
      }
      h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; }
      #site { color: var(--muted); margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" role="img" aria-label="Smart Study Distraction Blocker"></div>
      <h1>Blocked by Smart Study Distraction Blocker</h1>
      <p id="site"></p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
